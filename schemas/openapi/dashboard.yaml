openapi: 3.1.0
info:
  title: Dashboard API
  description: |
    `dashboard`: which metric columns and summary cards each building shows, and the catalog of
    metrics there are to choose from.

    - A building's columns also decide what its live feed carries: the tunnel republishes a
      telemetry tick only to buildings with preferences.
    - Writes land in memory and return `200` at once; saving to the database happens after, and
      a failure there is only logged. So `200` does not promise the change survives a restart.
    - Every route needs a session. Reading a building's columns or cards needs Cedar `Read` on the
      building (any role in one of its domains); saving them needs `Edit` (`business_staff` or higher).
      Dashboard asks digital-twin which domains the building belongs to.
  version: 1.0.0
servers:
  - url: http://localhost/dashboard
    description: Edge route for dashboard

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: authentication_token
      description: The gateway JWT. The edge checks it and passes the claims on as `x-gateway-claims`.

  parameters:
    BuildingId:
      in: path
      name: building_id
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    GetPreferencesResponse:
      type: object
      required: [building_id, allowed_columns]
      properties:
        building_id:
          type: string
          example: "42bc920a-8c39-48ae-b033-376739c8ebf0"
        allowed_columns:
          type: array
          items: { type: string }
          example: ["room_name", "room_max_occupancy", "temperature"]

    UpdatePreferencesRequest:
      type: object
      required: [allowed_columns]
      properties:
        allowed_columns:
          type: array
          items: { type: string }
          example: ["room_name", "people_count", "co2"]

    UpdatePreferencesResponse:
      type: object
      required: [status, building_id, active_columns]
      properties:
        status: { type: string, const: success }
        building_id: { type: string, example: "42bc920a-8c39-48ae-b033-376739c8ebf0" }
        active_columns: { type: integer, example: 3 }

    Cards:
      type: object
      required: [cards]
      properties:
        cards:
          type: array
          description: >
            The building's cards in display order: metric kinds from the catalog, or `rooms` and
            `alerts`. At most 32, each 1 to 64 characters, none twice.
          maxItems: 32
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 64 }
          example: ["rooms", "temperature", "people_count", "alerts"]

    MetricLimit:
      type: object
      description: >
        Which ends of the metric's limit can be set. A present key means that end can be set: a
        number is where a new building starts, `null` means no starting value. `{}` means no limit.
      additionalProperties: false
      properties:
        min: { type: [number, "null"], example: 18 }
        max: { type: [number, "null"], example: 27 }

    MetricAction:
      type: object
      required: [name, label, parameters]
      properties:
        name: { type: string, example: setTarget }
        label: { type: string }
        parameters:
          type: array
          items:
            type: object
            required: [name, type, required]
            properties:
              name: { type: string }
              type: { type: string }
              required: { type: boolean }

    MetricContract:
      type: object
      description: One metric. Built from `telemetry_schema::MetricContract`, the same type telemetry's `/contracts` serves.
      required: [kind, label, interface, unit, actions, limit]
      properties:
        kind: { type: string, example: "temperature" }
        label: { type: string, example: "Temperature" }
        interface: { type: string, example: "ITemperature" }
        unit: { type: [string, "null"], example: "°C" }
        actions:
          type: array
          items: { $ref: '#/components/schemas/MetricAction' }
        limit: { $ref: '#/components/schemas/MetricLimit' }
        aggregation:
          enum: [average, sum]
          description: >
            How a building's card adds up its rooms' readings: their mean or their total. Absent on a
            room attribute (a name, a capacity), which offers no card.
          example: average
        source:
          type: string
          description: The service that declared the metric.
          example: "telemetry"

security:
  - sessionCookie: []

paths:
  /:
    get:
      summary: Metric catalog
      description: |
        Calls `/contracts` on every service named by an environment variable ending in
        `_METRICS_URL` (2 s timeout each) and returns the union, duplicates removed. A source that
        is down, slow or unreadable is skipped, so the list can be shorter but the call never fails.
      tags: [Catalog]
      responses:
        "200":
          description: The combined catalog.
          content:
            application/json:
              schema:
                type: object
                required: [metrics]
                properties:
                  metrics:
                    type: array
                    items: { $ref: '#/components/schemas/MetricContract' }

  /preferences/{building_id}:
    parameters:
      - $ref: "#/components/parameters/BuildingId"
    get:
      summary: Get a building's columns
      description: Needs Cedar `Read` on the building.
      tags: [Preferences]
      responses:
        "200":
          description: The building's columns.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetPreferencesResponse"
        "403":
          description: The caller may not see this building, or the building is unknown. Empty body.
        "404":
          description: The building has no preferences. Empty body.
        "503":
          description: digital-twin could not say who owns the building. Empty body.
    post:
      summary: Replace a building's columns
      description: |
        Needs Cedar `Edit` on the building. Dashboard asks digital-twin which domains the building
        belongs to, with the caller's claims; nothing is stored unless the answer allows it.
      tags: [Preferences]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePreferencesRequest"
      responses:
        "200":
          description: Replaced in memory; saved to the database in the background.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdatePreferencesResponse"
        "403":
          description: The caller may not edit this building, or the building is unknown. Empty body.
        "503":
          description: digital-twin could not say who owns the building. Nothing stored. Empty body.

  /preferences/{building_id}/cards:
    parameters:
      - $ref: "#/components/parameters/BuildingId"
    get:
      summary: Get a building's cards
      description: Needs Cedar `Read` on the building.
      tags: [Preferences]
      responses:
        "200":
          description: The cards someone saved for the building.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cards"
        "404":
          description: Nobody saved cards for this building; the client shows its default. Empty body.
        "403":
          description: The caller may not see this building, or the building is unknown. Empty body.
        "503":
          description: digital-twin could not say who owns the building. Empty body.
    put:
      summary: Replace a building's cards
      description: |
        The same cards for everyone who views the building. Columns are left as they are. Needs
        Cedar `Edit` on the building.
      tags: [Preferences]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Cards"
      responses:
        "204":
          description: Replaced in memory; saved to the database in the background.
        "400":
          description: Too many cards, an empty or overlong id, or a card named twice. Nothing is stored.
          content:
            text/plain:
              schema: { type: string, example: "card co2 appears twice" }
        "403":
          description: The caller may not edit this building, or the building is unknown. Nothing stored. Empty body.
        "503":
          description: digital-twin could not say who owns the building. Nothing stored. Empty body.

  /preferences/init/{building_id}:
    post:
      summary: Give a new building its default columns
      description: |
        Sets `room_name` and `room_max_occupancy` when the building has no columns yet. A building
        that already has columns keeps them, so calling twice is safe. Needs Cedar `Edit` on the
        building: an entry turns on its live feed.
      tags: [Preferences]
      parameters:
        - $ref: "#/components/parameters/BuildingId"
      responses:
        "200":
          description: Defaults set, or already present. Empty body.
        "403":
          description: The caller may not edit this building, or the building is unknown. Nothing stored.
        "503":
          description: digital-twin could not say who owns the building. Nothing stored.

  /health:
    get:
      summary: Liveness probe
      tags: [Observability]
      security: []
      responses:
        "200": { description: Up. }

  /metrics:
    get:
      summary: Prometheus metrics
      tags: [Observability]
      security: []
      responses:
        "200":
          description: Prometheus text format.
          content:
            text/plain:
              schema: { type: string }
