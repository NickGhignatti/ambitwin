language: 'rust'

# build and lint come from .moon/tasks/rust.yml; `test` runs unit tests only,
# tests/*.rs need MongoDB and run through test-integration.sh
tasks:
  test:
    command: 'cargo test --lib'
  test-integration:
    command: 'bash test-integration.sh'
    inputs:
      - 'src/**/*'
      - 'tests/**/*'
      - 'Cargo.toml'
    options:
      cache: false
