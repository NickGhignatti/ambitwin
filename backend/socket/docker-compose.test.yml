include:
  - path: ../../infra/rust-base/docker-compose.yml

services:
  redis:
    image: redis:8.10.1-alpine

  socket-test:
    build:
      context: ../..
      dockerfile: backend/socket/Dockerfile
      additional_contexts:
        rust-base: service:rust-base
      target: test
    command: ["bash", "/app/scripts/rust-integration-tests.sh"]
    environment:
      - REDIS_URL=redis://redis:6379
    volumes:
      - ../../scripts/rust-integration-tests.sh:/app/scripts/rust-integration-tests.sh:ro
    depends_on:
      - redis
