services:
  claims-gateway:
    cpus: "3"
    build:
      context: ../..
      dockerfile: backend/claims-gateway/Dockerfile
    environment:
      - ADDR=:3000
      - OIDC_DISCOVERY_URL=http://keycloak:8080/realms/ambitwin
      - OIDC_ISSUER=${KEYCLOAK_PUBLIC_URL:-http://localhost:8090}/realms/ambitwin
      # id tokens come from the browser's client (cv-web), so their audience is cv-web
      - OIDC_CLIENT_ID=cv-web
      - TENANCY_URL=http://tenancy:3000
      - INTERNAL_SIGNING_SECRET=${INTERNAL_SIGNING_SECRET}
      - GATEWAY_ISSUER=cv-gateway
      - KEYCLOAK_REALM=ambitwin
      - REGISTRATION_CLIENT_ID=cv-gateway
      - REGISTRATION_CLIENT_SECRET=${CV_GATEWAY_CLIENT_SECRET:-dev-only-not-for-production}
      - GATEWAY_PRIVATE_KEY_FILE=/run/secrets/gateway-key.pem
    volumes:
      - ../../secrets/gateway-dev-key.pem:/run/secrets/gateway-key.pem:ro,z
    depends_on:
      keycloak:
        condition: service_healthy
      tenancy:
        condition: service_started
