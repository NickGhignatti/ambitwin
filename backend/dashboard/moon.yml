language: 'rust'

# The inherited `cargo test` also runs tests/*.rs, which need a MongoDB and Redis, so
# `just test all` could not go green without them already running.
tasks:
  test:
    command: 'cargo test --lib'
    inputs:
      - 'src/**/*'
      - 'Cargo.toml'
      - 'Cargo.lock'
      # infra/authz.rs embeds the shared Cedar bundle and replays its golden cases
      - '/backend/libs/auth-policy/policy.cedar'
      - '/backend/libs/auth-policy/schema.cedarschema'
      - '/backend/libs/auth-policy/fixtures/conformance.json'
      - '/backend/libs/auth-contracts/roles.json'
    options:
      mergeArgs: 'replace'

  test-integration:
    command: 'bash test-integration.sh'
    inputs:
      - 'src/**/*'
      - 'tests/**/*'
      - 'Cargo.toml'
      - 'Cargo.lock'
    options:
      cache: false
