name: CI Docker Build

on:
  workflow_call:
    inputs:
      images:
        description: >-
          JSON matrix (include-form) of { image, lang, context, dockerfile } objects to build.
        required: true
        type: string

jobs:
  rust-base:
    name: rust-base (${{ matrix.arch }})
    if: contains(inputs.images, '"lang":"rust"')
    # native runners: a Rust release build under QEMU emulation runs many times slower
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    outputs:
      ref: ${{ steps.base.outputs.ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish rust-base if missing
        id: base
        uses: ./.github/actions/rust-base

  build:
    name: docker (${{ matrix.entry.image }}, ${{ matrix.arch }})
    needs: rust-base
    # rust-base is skipped when no Rust image changed, which would skip this job too
    if: ${{ !cancelled() && needs.rust-base.result != 'failure' }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(inputs.images).include }}
        arch: [amd64, arm64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5

      - name: Set image ref
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.entry.image }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          ARCH: ${{ matrix.arch }}
        run: |
          OWNER_LOWERCASE=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_REF=ghcr.io/$OWNER_LOWERCASE/$IMAGE:pr-$PR_SHA-$ARCH" >> "$GITHUB_ENV"

      # Same Dockerfile, context and cache scope as cd-registry.yml, which promotes
      # this image on merge: one recipe, whichever path publishes it.
      - name: Build ${{ matrix.entry.image }}
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: ${{ matrix.entry.context }}
          file: ${{ matrix.entry.dockerfile }}
          build-contexts: ${{ needs.rust-base.outputs.ref && format('rust-base=docker-image://{0}-{1}', needs.rust-base.outputs.ref, matrix.arch) || '' }}
          # every image but go/rust (distroless) runs apk/apt upgrade, which a cached layer would skip
          no-cache: ${{ matrix.entry.lang != 'go' && matrix.entry.lang != 'rust' }}
          push: false
          load: true
          tags: ${{ env.IMAGE_REF }}
          cache-from: type=gha,scope=${{ matrix.entry.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.entry.image }}-${{ matrix.arch }}

      # Same gate cd-registry.yml applies at merge time, run here instead so the
      # image below is already vetted before it ever reaches GHCR — cd-registry.yml
      # then only has to promote (not rebuild) it once this PR lands on master.
      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore
          vuln-type: os

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed under a pr-<head-sha>-<arch> tag only — never :latest. The index
      # job joins the two CPUs under pr-<head-sha>, which cd-registry.yml promotes.
      - name: Push pr-tagged image (scan passed)
        run: docker push "$IMAGE_REF"

  index:
    name: index (${{ matrix.entry.image }})
    needs: build
    # a skipped rust-base up the chain would skip this job too
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(inputs.images).include }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # one tag for both CPUs: docker pulls the manifest that matches the machine
      - name: Join amd64 and arm64 under one tag
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.entry.image }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          OWNER_LOWERCASE=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          REF="ghcr.io/$OWNER_LOWERCASE/$IMAGE:pr-$PR_SHA"
          docker buildx imagetools create --tag "$REF" "$REF-amd64" "$REF-arm64"
